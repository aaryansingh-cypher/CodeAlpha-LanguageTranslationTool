<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Translate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:   #DFE3DD;
    --leaf:    #F4F6F1;
    --ink:     #1B2230;
    --ink-soft:#5A6473;
    --rule:    #C2C9BF;
    --source:  #7A2E2A;
    --target:  #1F5641;
    --focus:   #2C6E8F;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:   #11151B;
      --leaf:    #181D25;
      --ink:     #E7E9E3;
      --ink-soft:#97A1AE;
      --rule:    #2D3540;
      --source:  #CE8A81;
      --target:  #86C4A6;
      --focus:   #7FB5CE;
    }
  }
  :root[data-theme="dark"] {
    --paper:   #11151B;
    --leaf:    #181D25;
    --ink:     #E7E9E3;
    --ink-soft:#97A1AE;
    --rule:    #2D3540;
    --source:  #CE8A81;
    --target:  #86C4A6;
    --focus:   #7FB5CE;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Spectral", Georgia, "Noto Serif", serif;
    font-size: 17px;
    line-height: 1.55;
    font-weight: 300;
  }

  .sheet {
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(24px, 5vw, 56px) clamp(16px, 4vw, 40px) 64px;
  }

  .masthead { margin-bottom: clamp(20px, 4vw, 34px); }
  .masthead h1 {
    margin: 0;
    font-weight: 600;
    font-size: clamp(30px, 6vw, 44px);
    letter-spacing: -0.015em;
  }
  .masthead p {
    margin: 6px 0 0;
    color: var(--ink-soft);
    font-style: italic;
    max-width: 48ch;
  }

  .spread {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    background: var(--leaf);
    border: 1px solid var(--rule);
  }
  .spine { background: var(--rule); }

  .page { display: flex; flex-direction: column; min-width: 0; }
  .page-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px clamp(16px, 3vw, 26px) 10px;
    border-bottom: 1px solid var(--rule);
  }
  .page-head .side {
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .page[data-side="source"] .page-head .side { color: var(--source); }
  .page[data-side="target"] .page-head .side { color: var(--target); }

  .picker { position: relative; margin-left: auto; }
  .picker::after {
    content: "";
    position: absolute;
    right: 4px; top: 50%;
    width: 7px; height: 7px;
    border-right: 1px solid var(--ink-soft);
    border-bottom: 1px solid var(--ink-soft);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    padding: 2px 22px 3px 2px;
    border-radius: 0;
    cursor: pointer;
    max-width: 46vw;
  }
  select:hover { border-bottom-color: var(--ink-soft); }

  .page-body { flex: 1; padding: clamp(16px, 3vw, 26px); }
  textarea, .rendered {
    width: 100%;
    min-height: 230px;
    font: inherit;
    font-size: clamp(17px, 2.1vw, 19px);
    line-height: 1.65;
    color: var(--ink);
  }
  textarea {
    background: transparent;
    border: 0;
    padding: 0;
    resize: vertical;
    outline-offset: 6px;
  }
  textarea::placeholder { color: var(--ink-soft); font-style: italic; opacity: 1; }
  .rendered { white-space: pre-wrap; overflow-wrap: anywhere; }
  .rendered:empty::before {
    content: attr(data-placeholder);
    color: var(--ink-soft);
    font-style: italic;
  }
  .rendered.waiting { color: var(--ink-soft); font-style: italic; }

  .page-foot {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px clamp(16px, 3vw, 26px) 14px;
    border-top: 1px solid var(--rule);
    min-height: 48px;
    flex-wrap: wrap;
  }
  .count { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--source); }
  .foot-right { margin-left: auto; display: flex; gap: 14px; }

  .link {
    background: none;
    border: 0;
    padding: 2px 0;
    font: inherit;
    font-size: 14px;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .link:hover:not(:disabled) { color: var(--ink); border-bottom-color: var(--rule); }
  .link:disabled { opacity: .45; cursor: default; }

  .swap {
    position: absolute;
    left: 50%;
    top: 30px;
    transform: translate(-50%, -50%);
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    display: grid;
    place-items: center;
    z-index: 2;
  }
  .swap:hover { border-color: var(--ink-soft); }
  .swap svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.4; }

  .bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .status { font-size: 14px; color: var(--ink-soft); font-style: italic; flex: 1; min-width: 12ch; }
  .status.bad { color: var(--source); font-style: normal; }

  .go {
    font: inherit;
    font-size: 16px;
    padding: 11px 26px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    border-radius: 2px;
  }
  .go:hover:not(:disabled) { background: transparent; color: var(--ink); }
  .go:disabled { opacity: .4; cursor: default; }
  .go.stop { background: transparent; color: var(--ink); border-color: var(--rule); }

  .note {
    margin: 34px 0 0;
    font-size: 14px;
    color: var(--ink-soft);
    max-width: 62ch;
  }

  .keybox {
    margin-top: 14px;
    padding: 14px clamp(16px, 3vw, 22px);
    border: 1px solid var(--rule);
    background: var(--leaf);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .keybox label { font-size: 14px; color: var(--ink-soft); }
  .keybox input {
    flex: 1;
    min-width: 220px;
    font: inherit;
    font-size: 15px;
    padding: 7px 9px;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink);
    border-radius: 2px;
  }
  .keynote {
    flex-basis: 100%;
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
  }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  @media (max-width: 720px) {
    .spread { grid-template-columns: 1fr; }
    .spine { display: none; }
    .page[data-side="source"] { order: 1; }
    .swap {
      order: 2;
      position: static;
      transform: none;
      width: 100%;
      height: 44px;
      border-radius: 0;
      border: 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
    }
    .swap svg { transform: rotate(90deg); }
    .page[data-side="target"] { order: 3; }
    select { max-width: 60vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="sheet">
  <header class="masthead">
    <h1>Translate</h1>
    <p>Type on the left, read on the right. Pick the two languages and the text moves across the spine.</p>
  </header>

  <section class="spread">
    <button class="swap" id="swap" type="button" title="Swap languages" aria-label="Swap the two languages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h13M17 20l4-4-4-4M21 16H8"/></svg>
    </button>

    <div class="page" data-side="source">
      <div class="page-head">
        <span class="side">From</span>
        <span class="picker">
          <label class="sr-only" for="from" hidden>Translate from</label>
          <select id="from"></select>
        </span>
      </div>
      <div class="page-body">
        <textarea id="input" placeholder="Write or paste the text you want translated." spellcheck="false"></textarea>
      </div>
      <div class="page-foot">
        <span class="count" id="count">0 / 3000</span>
        <span class="foot-right">
          <button class="link" id="clear" type="button">Clear</button>
        </span>
      </div>
    </div>

    <div class="spine" role="presentation"></div>

    <div class="page" data-side="target">
      <div class="page-head">
        <span class="side">Into</span>
        <span class="picker">
          <label class="sr-only" for="to" hidden>Translate into</label>
          <select id="to"></select>
        </span>
      </div>
      <div class="page-body">
        <div class="rendered" id="output" data-placeholder="The translation appears here." aria-live="polite"></div>
      </div>
      <div class="page-foot">
        <span class="count" id="detected"></span>
        <span class="foot-right">
          <button class="link" id="listen" type="button" disabled>Listen</button>
          <button class="link" id="copy" type="button" disabled>Copy</button>
        </span>
      </div>
    </div>
  </section>

  <div class="bar">
    <span class="status" id="status"></span>
    <button class="link" id="settingsBtn" type="button">API key</button>
    <button class="go" id="go" type="button">Translate</button>
  </div>

  <div class="keybox" id="keybox" hidden>
    <label for="apiKey">Gemini API key</label>
    <input type="password" id="apiKey" autocomplete="off" spellcheck="false" placeholder="Paste your Gemini API key">
    <button class="link" id="saveKey" type="button">Save</button>
    <span class="keynote">Stored only in this browser (localStorage), sent only to Google's API.</span>
  </div>

  <p class="note" id="note"></p>
</main>

<script>
(function () {
  "use strict";

  var LANGS = [
    { code: "auto", name: "Detect language" },
    { code: "en",  name: "English" },
    { code: "hi",  name: "Hindi" },
    { code: "bn",  name: "Bengali" },
    { code: "mr",  name: "Marathi" },
    { code: "ta",  name: "Tamil" },
    { code: "te",  name: "Telugu" },
    { code: "ur",  name: "Urdu", rtl: true },
    { code: "ar",  name: "Arabic", rtl: true },
    { code: "fa",  name: "Persian", rtl: true },
    { code: "he",  name: "Hebrew", rtl: true },
    { code: "es",  name: "Spanish" },
    { code: "fr",  name: "French" },
    { code: "de",  name: "German" },
    { code: "it",  name: "Italian" },
    { code: "pt",  name: "Portuguese" },
    { code: "nl",  name: "Dutch" },
    { code: "pl",  name: "Polish" },
    { code: "ru",  name: "Russian" },
    { code: "uk",  name: "Ukrainian" },
    { code: "el",  name: "Greek" },
    { code: "tr",  name: "Turkish" },
    { code: "sw",  name: "Swahili" },
    { code: "zh",  name: "Chinese (Simplified)" },
    { code: "ja",  name: "Japanese" },
    { code: "ko",  name: "Korean" },
    { code: "vi",  name: "Vietnamese" },
    { code: "th",  name: "Thai" },
    { code: "id",  name: "Indonesian" }
  ];

  var MAX = 3000;
  var $ = function (id) { return document.getElementById(id); };
  var fromSel = $("from"), toSel = $("to"), input = $("input"), output = $("output");
  var go = $("go"), status = $("status"), count = $("count"), detected = $("detected");
  var copyBtn = $("copy"), listenBtn = $("listen"), clearBtn = $("clear"), swapBtn = $("swap"), note = $("note");
  var settingsBtn = $("settingsBtn"), keybox = $("keybox"), apiKeyInput = $("apiKey"), saveKeyBtn = $("saveKey");

  var GEMINI_MODELS = ["gemini-3.6-flash", "gemini-2.5-flash", "gemini-2.0-flash"];
  var KEY_STORAGE = "gemini_api_key";

  var apiKey = localStorage.getItem(KEY_STORAGE) || "";
  var ready = !!apiKey;
  var running = null;     // AbortController for the call in flight
  var lastText = "";

  LANGS.forEach(function (l) {
    if (l.code !== "auto") {
      var b = document.createElement("option");
      b.value = l.code; b.textContent = l.name; toSel.appendChild(b);
    }
    var a = document.createElement("option");
    a.value = l.code; a.textContent = l.name; fromSel.appendChild(a);
  });
  fromSel.value = "auto";
  toSel.value = "es";

  function lang(code) {
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].code === code) return LANGS[i];
    return LANGS[1];
  }

  function updateCount() {
    var n = input.value.length;
    count.textContent = n + " / " + MAX;
    count.classList.toggle("over", n > MAX);
    go.disabled = running ? false : (!input.value.trim() || n > MAX);
  }

  function setStatus(msg, bad) {
    status.textContent = msg || "";
    status.classList.toggle("bad", !!bad);
  }

  function showResult(text) {
    lastText = text;
    output.textContent = text;
    output.classList.remove("waiting");
    var t = lang(toSel.value);
    output.dir = t.rtl ? "rtl" : "ltr";
    output.lang = t.code;
    copyBtn.disabled = !text;
    listenBtn.disabled = !text || !("speechSynthesis" in window);
  }

  // ---------------------------------------------------------------
  // Where the translation comes from: the Gemini API, called directly
  // from the browser with the key the user pastes into "API key"
  // above (stored only in this browser's localStorage).
  //
  // For anything beyond personal/local use, don't ship a client-side
  // key: proxy this same request through your own server instead, the
  // way the README describes for Google Cloud Translation.
  // ---------------------------------------------------------------

  function buildPrompt(text, from, to) {
    var src = from === "auto" ? "whatever language it is written in" : lang(from).name;
    return "Translate the text between the markers from " + src + " into " + lang(to).name + ".\n" +
      "Reply with only the translation. No quotation marks, no transliteration, no notes, no explanation.\n" +
      "Keep the original line breaks, punctuation style and tone. Leave proper names as they are.\n\n" +
      "<<<TEXT\n" + text + "\nTEXT>>>";
  }

  function geminiUrl(model) {
    return "https://generativelanguage.googleapis.com/v1beta/models/" + model +
      ":generateContent?key=" + encodeURIComponent(apiKey);
  }

  async function requestGemini(model, prompt, signal) {
    var res = await fetch(geminiUrl(model), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: signal,
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.2 }
      })
    });

    if (!res.ok) {
      var err = null;
      try { err = (await res.json()).error; } catch (e) {}
      var msg = (err && err.message) || res.statusText || ("HTTP " + res.status);
      var code = "upstream_error";
      if (res.status === 400 && /API key/i.test(msg)) code = "bad_key";
      else if (res.status === 403) code = "bad_key";
      else if (res.status === 404) code = "bad_model";
      else if (res.status === 429) code = "rate_limited";
      throw { code: code, message: msg, status: res.status };
    }

    var data = await res.json();
    var cand = data.candidates && data.candidates[0];
    var text = cand && cand.content && cand.content.parts
      ? cand.content.parts.map(function (p) { return p.text || ""; }).join("")
      : "";
    if (!text.trim()) {
      var reason = cand && cand.finishReason;
      throw { code: reason === "SAFETY" ? "refused" : "empty_completion", message: reason || "empty response" };
    }
    return { text: text.trim(), truncated: cand.finishReason === "MAX_TOKENS" };
  }

  async function callGemini(prompt, signal) {
    var lastErr = null;
    for (var i = 0; i < GEMINI_MODELS.length; i++) {
      try {
        return await requestGemini(GEMINI_MODELS[i], prompt, signal);
      } catch (e) {
        lastErr = e;
        if (!e || e.code !== "bad_model") throw e;   // only keep trying on model-not-found
      }
    }
    throw lastErr;
  }

  var MESSAGES = {
    bad_key:          "That API key was rejected. Check it under \u201cAPI key\u201d and try again.",
    bad_model:        "That Gemini model isn't available for this key.",
    rate_limited:     "Too many translations at once. Wait a moment and try again.",
    refused:          "That text can't be translated here. Try different wording.",
    empty_completion: "Nothing came back. Try a shorter passage.",
    prompt_too_large: "That passage is too long. Send a few paragraphs at a time.",
    upstream_error:   "The translation didn't come through.",
    network:          "Couldn't reach the translation service. Check your connection and try again."
  };

  function requireKey() {
    if (apiKey) return true;
    keybox.hidden = false;
    apiKeyInput.focus();
    setStatus("Add your Gemini API key to translate.", true);
    return false;
  }

  async function detect(text) {
    detected.textContent = "";
    if (fromSel.value !== "auto" || !apiKey) return;
    try {
      var r = await callGemini(
        "Identify the language of the text between the markers. Reply with only the English name of " +
        "the language — one or two words, nothing else.\n\n<<<TEXT\n" + text.slice(0, 400) + "\nTEXT>>>"
      );
      var name = r.text.trim().split("\n")[0].replace(/[."']/g, "").slice(0, 30);
      if (name) detected.textContent = "Detected " + name;
    } catch (e) { /* detection is a nicety; stay quiet if it fails */ }
  }

  async function run() {
    var text = input.value.trim();
    if (!text || text.length > MAX) return;
    if (!requireKey()) return;

    running = new AbortController();
    go.textContent = "Stop";
    go.classList.add("stop");
    go.disabled = false;
    copyBtn.disabled = listenBtn.disabled = true;
    detected.textContent = "";
    output.textContent = "Translating…";
    output.classList.add("waiting");
    setStatus("");

    detect(text);

    try {
      var res = await callGemini(buildPrompt(text, fromSel.value, toSel.value), running.signal);
      showResult(res.text);
      if (res.truncated) setStatus("The translation was cut short. Send a shorter passage.", true);
    } catch (e) {
      output.textContent = "";
      output.classList.remove("waiting");
      if (e && e.name === "AbortError") {
        setStatus("Stopped.");
      } else {
        var code = e && e.code ? e.code : "network";
        var friendly = MESSAGES[code] || MESSAGES.upstream_error;
        var detail = e && e.message ? " (" + e.message + ")" : "";
        setStatus(friendly + detail, true);
        if (code === "bad_key") { keybox.hidden = false; apiKeyInput.focus(); }
      }
    } finally {
      running = null;
      go.textContent = "Translate";
      go.classList.remove("stop");
      updateCount();
    }
  }

  go.addEventListener("click", function () {
    if (running) { running.abort(); return; }
    run();
  });

  settingsBtn.addEventListener("click", function () {
    keybox.hidden = !keybox.hidden;
    if (!keybox.hidden) { apiKeyInput.value = apiKey; apiKeyInput.focus(); }
  });

  saveKeyBtn.addEventListener("click", function () {
    apiKey = apiKeyInput.value.trim();
    if (apiKey) localStorage.setItem(KEY_STORAGE, apiKey);
    else localStorage.removeItem(KEY_STORAGE);
    ready = !!apiKey;
    setStatus(apiKey ? "API key saved." : "");
    keybox.hidden = true;
    updateCount();
  });
  apiKeyInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); saveKeyBtn.click(); }
  });

  input.addEventListener("input", updateCount);
  input.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); go.click(); }
  });

  clearBtn.addEventListener("click", function () {
    input.value = "";
    showResult("");
    output.textContent = "";
    detected.textContent = "";
    setStatus("");
    updateCount();
    input.focus();
  });

  swapBtn.addEventListener("click", function () {
    var from = fromSel.value, to = toSel.value;
    if (from === "auto") {
      setStatus("Choose a language on the left to swap sides.");
      fromSel.focus();
      return;
    }
    fromSel.value = to;
    toSel.value = from;
    if (lastText) {
      input.value = lastText;
      output.textContent = "";
      showResult("");
    }
    detected.textContent = "";
    setStatus("");
    updateCount();
  });

  toSel.addEventListener("change", function () { if (lastText) showResult(lastText); });

  copyBtn.addEventListener("click", async function () {
    if (!lastText) return;
    try {
      await navigator.clipboard.writeText(lastText);
    } catch (e) {
      var ta = document.createElement("textarea");
      ta.value = lastText; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (_) {}
      document.body.removeChild(ta);
    }
    copyBtn.textContent = "Copied";
    setTimeout(function () { copyBtn.textContent = "Copy"; }, 1600);
  });

  listenBtn.addEventListener("click", function () {
    if (!("speechSynthesis" in window) || !lastText) return;
    if (speechSynthesis.speaking) {
      speechSynthesis.cancel();
      listenBtn.textContent = "Listen";
      return;
    }
    var u = new SpeechSynthesisUtterance(lastText);
    u.lang = toSel.value;
    u.rate = 0.95;
    u.onend = u.onerror = function () { listenBtn.textContent = "Listen"; };
    listenBtn.textContent = "Stop";
    speechSynthesis.speak(u);
  });

  window.addEventListener("beforeunload", function () {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  });

  note.textContent = "Ctrl or \u2318 + Enter translates. Listen uses your browser's built-in voices, so the " +
    "quality depends on which ones are installed. Translation runs on the Gemini API using the key you " +
    "provide, stored only in this browser.";
  if (!apiKey) setStatus("Add your Gemini API key to translate.");
